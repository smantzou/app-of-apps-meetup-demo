---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  name: dummy
  namespace: argocd
spec:
  destination:
    namespace: dummy
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://github.com/smantzou/app-of-apps-meetup-demo.git
    path: charts/dummy
    targetRevision: main
    helm:
      releaseName: dummy
      valueFiles:
        - values.yaml
        - values.demo.yaml
  syncPolicy:
    automated:
      allowEmpty: false
      prune: true
      selfHeal: true
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ServerSideApply=true
